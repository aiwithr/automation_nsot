{% extends "base.html" %}

{% block site_meta %}

  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="author" content="Rakibul Hassan (রকিবুল হাসান)">
  <meta name="creator" content="Rakibul Hassan">
  <meta name="publisher" content="Rakibul Hassan">
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
  <meta name="keywords" content="নেটওয়ার্ক সোর্স অব ট্রুথ, নেটওয়ার্ক সোর্স অফ ট্রুথ, NSoT, Network Source of Truth, আইএসপি অটোমেশন, ISP automation, Nautobot, NetBox, নেটওয়ার্ক অটোমেশন, রোড টু হাইটেক ইন্ডাস্ট্রি, রকিবুল হাসান, Rakibul Hassan, aiwithr">
  <meta name="description" content="{% if page and page.meta and page.meta.description %}{{ page.meta.description | e }}{% elif page and page.title and not page.is_homepage %}{{ page.title | e }} — নেটওয়ার্ক ও আইএসপি অটোমেশন: নেটওয়ার্ক সোর্স অব ট্রুথ (NSoT) — রকিবুল হাসান (Rakibul Hassan)।{% else %}{{ config.site_description | e }}{% endif %}">
  {% if page.canonical_url %}
    <link rel="canonical" href="{{ page.canonical_url }}">
  {% endif %}
  {% if page.previous_page %}
    <link rel="prev" href="{{ page.previous_page.url | url }}">
  {% endif %}
  {% if page.next_page %}
    <link rel="next" href="{{ page.next_page.url | url }}">
  {% endif %}
{% endblock %}
